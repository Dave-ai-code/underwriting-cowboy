<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Default SEO (overridden per-page by react-helmet-async) ── -->
    <title>UnderwritingCowboy | AI in Insurance Underwriting</title>
    <meta name="description" content="A field guide for working underwriters — real AI prompts, real walkthroughs, real verdicts. Written by a former APAC underwriting head." />
    <link rel="canonical" href="https://underwritingcowboy.com/" />

    <!-- ── Open Graph fallback (LinkedIn, Facebook, Slack) ── -->
    <!-- These are the fallback tags shown before React hydrates.    -->
    <!-- Per-page tags set by the SEO component override these.      -->
    <!-- ACTION: replace /og-image.jpg with a real 1200×630px image  -->
    <meta property="og:site_name"    content="Underwriting Cowboy" />
    <meta property="og:type"         content="website" />
    <meta property="og:title"        content="UnderwritingCowboy | AI in Insurance Underwriting" />
    <meta property="og:description"  content="A field guide for working underwriters — real AI prompts, real walkthroughs, real verdicts." />
    <meta property="og:url"          content="https://underwritingcowboy.com/" />
    <meta property="og:image"        content="https://underwritingcowboy.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter / X card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="UnderwritingCowboy | AI in Insurance Underwriting" />
    <meta name="twitter:description" content="A field guide for working underwriters — real AI prompts, real walkthroughs, real verdicts." />
    <meta name="twitter:image"       content="https://underwritingcowboy.com/og-image.jpg" />

    <!-- ── Fonts (display=swap avoids invisible text while loading) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
